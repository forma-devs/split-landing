<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Join Group - Ceru</title>
  <meta property="og:title" content="You're invited to Ceru!" />
  <meta property="og:description" content="Tap to join the group and start splitting expenses." />
  <meta property="og:type" content="website" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f5f5f7;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
    }
    .card {
      background: #fff;
      border-radius: 20px;
      padding: 40px 32px;
      max-width: 400px;
      width: 100%;
      text-align: center;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
    }
    .logo {
      font-size: 48px;
      margin-bottom: 16px;
    }
    h1 {
      font-size: 24px;
      font-weight: 700;
      color: #1a1a1a;
      margin-bottom: 8px;
    }
    p {
      font-size: 15px;
      color: #666;
      margin-bottom: 32px;
      line-height: 1.6;
    }
    .btn {
      display: block;
      width: 100%;
      padding: 16px;
      border-radius: 14px;
      font-size: 16px;
      font-weight: 600;
      text-decoration: none;
      margin-bottom: 12px;
      cursor: pointer;
    }
    .btn-primary {
      background: #007AFF;
      color: #fff;
    }
    .btn-secondary {
      background: #f0f0f5;
      color: #333;
      font-size: 14px;
    }
    .code {
      font-family: monospace;
      font-size: 18px;
      letter-spacing: 3px;
      background: #f0f0f5;
      padding: 12px 20px;
      border-radius: 10px;
      display: inline-block;
      margin-bottom: 24px;
      color: #333;
    }
    #fallback { display: none; margin-top: 16px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">&#128184;</div>
    <h1>You're invited!</h1>
    <p>Open Ceru to join the group</p>
    <div class="code" id="codeDisplay"></div>
    <a class="btn btn-primary" id="openApp" href="#">
      Open Ceru
    </a>
    <div id="fallback">
      <p style="margin-bottom: 12px; font-size: 13px;">Don't have the app yet?</p>
      <!--
        AT SUBMISSION: replace this with the real store links, one per platform:
          https://apps.apple.com/app/split-ai/id<REAL_APPLE_ID>
          https://play.google.com/store/apps/details?id=<REAL_PACKAGE_NAME>
        It previously pointed at .../id000000000, which is not a real app: an
        invited person who did not have Ceru landed on an App Store error.
        Until the app is published there is no honest store link to give, so this
        sends them to the site instead.
      -->
      <a class="btn btn-secondary" href="https://ceruapp.com" target="_blank" rel="noopener">
        Learn about Ceru
      </a>
    </div>
  </div>

  <script>
    // Two shapes reach this page: /join?code=CODE, which the join edge function
    // redirects to, and /join/CODE, which the app builds directly as a universal
    // link once EXPO_PUBLIC_APP_LINK_DOMAIN is set. Accept either.
    var params = new URLSearchParams(window.location.search);
    var raw = params.get('code');
    if (!raw) {
      var seg = window.location.pathname.split('/').filter(Boolean);
      if (seg.length > 1 && seg[0] === 'join') raw = seg[seg.length - 1];
    }
    var code = (raw || '').replace(/[^a-zA-Z0-9]/g, '');

    if (code.length >= 8) {
      var deepLink = 'splitai://join/' + code;
      var formatted = code.slice(0, 4) + '\u00a0' + code.slice(4, 8) + '\u00a0' + code.slice(8);
      document.getElementById('codeDisplay').textContent = formatted;
      document.getElementById('openApp').href = deepLink;

      document.getElementById('openApp').addEventListener('click', function(e) {
        e.preventDefault();
        window.location.href = deepLink;
        setTimeout(function() {
          document.getElementById('fallback').style.display = 'block';
        }, 2000);
      });

      // Auto-redirect on page load
      window.location.href = deepLink;
      setTimeout(function() {
        document.getElementById('fallback').style.display = 'block';
      }, 2500);
    } else {
      document.getElementById('codeDisplay').textContent = 'Invalid code';
    }
  </script>
</body>
</html>
